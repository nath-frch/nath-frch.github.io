<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAE1.04</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="img/png" href="img/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>SAÉ1.04 Se présenter sur Internet</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                <a href="index.html#projets" class="nav-link">Accueil</a>
                </li>
            </ul>
            <div class="nav-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>
    
    <section id="projets" class="projects">
        <div class="container">
            <div class="projects-grid">
                <div class="project-card">
                    <div class="project-content">
                        <h3>Le projet :</h3>
                        <p>Durant cette SAE j'ai dû créer en cv web en html/css</p>
                    </div>
                </div>
                <div class="project-card">
                    <div class="project-content">
                        <h3>Apprentissages critiques :</h3>
                        <ul> 
                            <li>AC13.01 | Utiliser un système informatique et ses outils</li> 
                            <li>AC13.04 | Connaître l’architecture et les technologies d’un site Web</li> 
                        </ul>
                    </div>
                </div>
           </div>
        </div>
    </section>
    
    <script>
        // Menu mobile toggle
        const navToggle = document.querySelector('.nav-toggle');
        const navMenu = document.querySelector('.nav-menu');

        navToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            navToggle.classList.toggle('active');
        });

        // Smooth scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 100) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Project card hover effects
        const projectCards = document.querySelectorAll('.project-card');
        projectCards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-10px) scale(1.02)';
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0) scale(1)';
            });
        });
    </script>
</body>
</html>
